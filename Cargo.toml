[package]
name = "luks-volume-key-hash"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2024"
repository = "https://github.com/chenxiaolong/luks-volume-key-hash"
publish = false

[dependencies]
anyhow = "1.0.79"
clap = { version = "4.4.16", features = ["derive"] }
hmac = { version = "0.13.0", features = ["zeroize"] }
libcryptsetup-rs = "0.16.1"
passterm = { version = "2.1.0", features = ["secure_zero"] }
sha2 = { version = "0.11.1", features = ["zeroize"] }
uuid = "1.28.0"
zeroize = "1.9.1"
